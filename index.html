<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Multiple icon formats so every surface (browser tab, OS share
         sheets, link previews, bookmarks) that reads its own preferred
         format finds the current logo, not a stale/blank fallback. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Watch Hindi & World Short Films Online | SHORTSinSHORT</title>
    <meta name="title" content="Watch Hindi & World Short Films Online | SHORTSinSHORT" />
    <meta name="description" content="Watch curated short films online - Hindi, English and world cinema shorts, thrillers, human dramas, award-winning festival picks, and AI cinema, handpicked by SHORTSinSHORT." />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.shortsinshort.com/" />
    <meta property="og:site_name" content="SHORTSinSHORT" />
    <meta property="og:title" content="Watch Hindi & World Short Films Online | SHORTSinSHORT" />
    <meta property="og:description" content="Watch curated short films online - Hindi, English and world cinema shorts, thrillers, human dramas, award-winning festival picks, and AI cinema, handpicked by SHORTSinSHORT." />
    <meta property="og:image" content="https://www.shortsinshort.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://www.shortsinshort.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.shortsinshort.com/" />
    <meta name="twitter:title" content="Watch Hindi & World Short Films Online | SHORTSinSHORT" />
    <meta name="twitter:description" content="Watch curated short films online - Hindi, English and world cinema shorts, thrillers, human dramas, award-winning festival picks, and AI cinema, handpicked by SHORTSinSHORT." />
    <meta name="twitter:image" content="https://www.shortsinshort.com/og-image.png" />
  
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#dc2626" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>

  
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SHORTSinSHORT" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Organization / WebSite structured data - helps Google understand
         SHORTSinSHORT as a distinct brand entity, separate from generic
         "short films" or "shorts" searches. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.shortsinshort.com/#organization",
            "name": "SHORTSinSHORT",
            "url": "https://www.shortsinshort.com/",
            "logo": "https://www.shortsinshort.com/icon-512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.shortsinshort.com/#website",
            "name": "SHORTSinSHORT",
            "url": "https://www.shortsinshort.com/",
            "description": "Watch curated short films online - Hindi, English and world cinema shorts, handpicked from India and around the world.",
            "publisher": { "@id": "https://www.shortsinshort.com/#organization" },
            "inLanguage": ["en", "hi"]
          }
        ]
      }
    </script>

  </head>
  <body class="bg-[#0d0d0f] text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
