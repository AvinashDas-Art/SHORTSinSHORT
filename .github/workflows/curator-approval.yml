name: Curator Film Approval

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: shortsinshort-catalogue-main
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.title == 'SHORTSinSHORT - Films Awaiting Approval' &&
      github.actor == 'AvinashDas-Art' &&
      (contains(github.event.comment.body, '/approve ') || contains(github.event.comment.body, '/reject '))
    runs-on: ubuntu-latest
    steps:
      - name: Parse owner commands
        id: commands
        uses: actions/github-script@v7
        with:
          script: |
            const text = context.payload.comment.body;
            const lines = text.split('\n');
            const parsed = [];

            for (const line of lines) {
              const match = line.trim().match(/^\/(approve|reject)\s+([A-Za-z0-9_-]{11})$/);
              if (match) {
                parsed.push({ action: match[1], videoId: match[2] });
              }
            }

            if (parsed.length === 0) {
              core.setFailed('No valid /approve VIDEO_ID or /reject VIDEO_ID commands found.');
            }

            return JSON.stringify(parsed);

      - name: Checkout main catalogue
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record, publish, verify and push (with retry on race)
        env:
          COMMANDS_JSON: ${{ steps.commands.outputs.result }}
        run: |
          set -e
          git config user.name "SHORTSinSHORT Curator Bot"
          git config user.email "curator-bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            node -e '
              const commands = JSON.parse(process.env.COMMANDS_JSON);
              const { execSync } = require("child_process");
              for (const cmd of commands) {
                console.log(`Processing: ${cmd.action} ${cmd.videoId}`);
                execSync(`npm run catalogue:review -- "${cmd.action}" "${cmd.videoId}"`, { stdio: "inherit" });
              }
            '
            npm run catalogue:publish-approved
            npm run catalogue:curate
            npm run build

            git add src/data public/sitemap.xml
            if git diff --cached --quiet; then
              echo "Nothing to commit - decision already applied upstream."
              break
            fi
            git commit -m "Record curator bulk actions"

            if git push origin HEAD:main; then
              echo "Pushed successfully on attempt ${attempt}."
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "::error::Failed to push curator decision after 5 attempts (persistent race with another workflow)."
              exit 1
            fi

            echo "Push rejected (likely a race with another workflow) - refetching origin/main and retrying (attempt ${attempt})..."
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 5))
          done

      - name: Confirm decisions in Issue
        uses: actions/github-script@v7
        env:
          COMMANDS_JSON: ${{ steps.commands.outputs.result }}
        with:
          script: |
            const commands = JSON.parse(process.env.COMMANDS_JSON);
            let summaryText = '### Curator Decisions Applied:\n\n';

            for (const cmd of commands) {
              const word = cmd.action === 'approve' ? 'APPROVED' : 'REJECTED';
              summaryText += `- ✅ **${word}**: \`${cmd.videoId}\`\n`;
            }

            summaryText += '\nलाइव कैटलॉग अपडेट हो गया है।';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summaryText
            });
