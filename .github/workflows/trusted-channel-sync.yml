- name: Publish new films
        run: |
          if git diff --quiet -- src/data/films.json; then
            echo "No new films from trusted channels."
            exit 0
          fi
          git config user.name "SHORTSinSHORT Trusted Channel Bot"
          git config user.email "trusted-channel-bot@users.noreply.github.com"
          git add -A
          git commit -m "Auto-add new upload(s) from a trusted channel"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
