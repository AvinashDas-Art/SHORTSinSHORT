name: Daily YouTube Health Check & Catalog Sync

on:
  schedule:
    # रोज़ाना रात 2:00 AM IST (20:30 UTC) पर ऑटोमैटिक चलेगा
    - cron: '30 20 * * *'
  workflow_dispatch: # आवश्यकता पड़ने पर GitHub से मैन्युअली भी चला सकते हैं

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run YouTube Health Check
        run: npm run sync

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/films.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-clean broken/deleted YouTube films [skip ci]" && git push)
