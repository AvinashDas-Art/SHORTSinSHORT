name: Global YouTube Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: global-youtube-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Discover review candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run catalogue:discover -- --apply
      - name: Verify production build
        run: npm run build
      - name: Save review queue
        run: |
          if git diff --quiet -- src/data/discovery-queue.json src/data/discovery-rejected.json; then
            echo "No new discovery candidates."
            exit 0
          fi
          git config user.name "SHORTSinSHORT Discovery Bot"
          git config user.email "discovery-bot@users.noreply.github.com"
          git add src/data/discovery-queue.json src/data/discovery-rejected.json
          git commit -m "Add YouTube films to curator review queue"
          git push origin HEAD:main
      - name: Prepare curator review notification
        env:
          REVIEW_FILE: ${{ runner.temp }}/shortsinshort-review.json
        run: node scripts/build-review-notification.mjs
      - name: Notify SHORTSinSHORT curator
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ runner.temp }}/shortsinshort-review.json
        with:
          script: |
            const fs = require('fs');
            const review = JSON.parse(fs.readFileSync(process.env.REVIEW_FILE, 'utf8'));
            if (!review.pendingCount) {
              core.info('No pending candidates.');
              return;
            }
            const title = 'SHORTSinSHORT - Films Awaiting Approval';
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = all.find((item) => !item.pull_request && item.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: review.body,
                assignees: [context.repo.owner]
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `@${context.repo.owner} review queue updated - ${review.pendingCount} candidate(s) waiting.`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: review.body,
                assignees: [context.repo.owner]
              });
            }
