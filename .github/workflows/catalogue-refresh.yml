name: Daily Catalogue Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: shortsinshort-catalogue-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalogue
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check availability and collect new candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          npm run catalogue:audit -- --apply
          npm run catalogue:trusted-sync -- --apply
          npm run catalogue:discover -- --apply
          npm run catalogue:discover-channels -- --apply

      - name: Reconcile approved films and polish catalogue
        run: |
          npm run catalogue:publish-approved
          npm run catalogue:curate
          npm run build

      - name: Prepare curator digest
        env:
          REVIEW_FILE: ${{ runner.temp }}/shortsinshort-review.json
        run: node scripts/build-review-notification.mjs

      - name: Save catalogue refresh
        run: |
          if git diff --quiet; then
            echo "Catalogue is already current."
            exit 0
          fi
          git config user.name "SHORTSinSHORT Catalogue Bot"
          git config user.email "catalogue-bot@users.noreply.github.com"
          git add src/data public/sitemap.xml
          git commit -m "Refresh and curate film catalogue"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Update curator digest
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: ${{ runner.temp }}/shortsinshort-review.json
        with:
          script: |
            const fs = require('fs');
            const review = JSON.parse(fs.readFileSync(process.env.REVIEW_FILE, 'utf8'));
            const title = 'SHORTSinSHORT - Films Awaiting Approval';
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = all.find((item) => !item.pull_request && item.title === title);
            if (!review.pendingCount) {
              if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' });
              return;
            }
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body: review.body, assignees: [context.repo.owner] });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body: review.body, assignees: [context.repo.owner] });
            }
