name: Daily Short Film Feed Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add Daily Film from Backlog
        run: |
          node scripts/add-daily-film.mjs

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # फ़ाइलों को स्टेज करें
          git add data/films.json scripts/film-backlog.json
          
          # केवल तभी कमिट और पुश करें जब सचमुच बदलाव हुए हों
          if ! git diff --staged --quiet; then
            git commit -m "Auto: Added daily film from backlog"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin main
          else
            echo "No new updates found in backlog to commit."
          fi
