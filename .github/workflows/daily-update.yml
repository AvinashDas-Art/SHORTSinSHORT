name: Daily Short Film Feed Update

on:
  schedule:
    - cron: '0 6 * * *' # हर रोज़ सुबह 6:00 UTC पर चलेगा
  workflow_dispatch:     # मैन्युअल चलाने का विकल्प

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Add Daily Film from Backlog
        run: |
          node scripts/add-daily-film.mjs

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/films.json scripts/film-backlog.json
          git commit -m "Auto: Added daily film from backlog" || exit 0
          git push
