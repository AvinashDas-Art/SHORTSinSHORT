name: Daily Short Film Feed Update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add Daily Film from Backlog
        run: |
          node scripts/add-daily-film.mjs

      - name: Commit & Push Changes Automatically
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Added daily film from backlog"
          file_pattern: "src/data/films.json scripts/film-backlog.json"
